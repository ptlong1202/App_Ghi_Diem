<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BadmintonPro">
<script>try{var _t=localStorage.getItem('pro_badminton_theme')||'auto';document.documentElement.dataset.theme=(_t==='dark'||(_t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<title>🏸 Badminton Pro Scoreboard</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--primary:#007AFF;--success:#34C759;--danger:#FF3B30;--warning:#FF9500;--bg:#F2F2F7;--card:#fff;--soft:#F9F9FB;--line:#F2F2F7;--text:#1C1C1E;--gray:#8E8E93;--ac:#007AFF;--rlbg:#1C1C1E;--rlfg:#fff;--rl:24px;--rm:16px;--shadow:0 8px 32px rgba(0,0,0,.05)}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--soft:#2C2C2E;--line:#3A3A3C;--text:#fff;--gray:#B4B4BC;--primary:#0A84FF;--ac:#64B5FF;--success:#32D74B;--danger:#FF6B61;--warning:#FFB340;--rlbg:#F2F2F7;--rlfg:#1C1C1E;--shadow:none;color-scheme:dark}
:root[data-theme="dark"] .win{background:rgba(50,215,75,.22)}
:root[data-theme="dark"] .lose{background:rgba(255,107,97,.2)}
:root[data-theme="dark"] .score-trick{color:#E3AEFF!important;border-color:#E3AEFF}
:root[data-theme="dark"] #toast{background:#3A3A3C}
.rl{font-weight:800;font-size:11px;background:var(--rlbg);color:var(--rlfg);padding:4px 10px;border-radius:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
.app{width:100%;max-width:500px;height:100dvh;display:flex;flex-direction:column;position:relative}
.safe-top{height:calc(env(safe-area-inset-top,0px) + 10px);min-height:44px;flex-shrink:0}
.scroll{flex-grow:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 120px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 0;margin-bottom:12px;position:sticky;top:0;z-index:99}
.btn-glass{background:var(--card);border:none;width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);font-size:16px;cursor:pointer}
.pill{background:var(--soft);padding:8px 14px;border-radius:40px;font-size:13px;font-weight:700;border:none;cursor:pointer}
.pill.on{background:var(--rlbg);color:var(--rlfg)}
.pro-card{background:var(--card);border-radius:var(--rl);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);cursor:pointer}
.tw{background:var(--card);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
.ts{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--soft);padding:15px 8px;font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.total-row td{padding:12px 8px;font-size:22px;font-weight:800;color:var(--ac);text-align:center;border-bottom:2px solid var(--line)}
tbody td{padding:14px 8px;text-align:center;font-weight:600;border-top:1px solid var(--line);font-size:15px}
tbody tr{cursor:pointer}
.badge{padding:5px 10px;border-radius:8px;font-size:14px;display:inline-block;min-width:35px}
.win{background:rgba(52,199,89,.15);color:var(--success)}.lose{background:rgba(255,59,48,.12);color:var(--danger)}
.score-trick{color:#A020F0!important;font-weight:900;border:1.5px solid #A020F0}
.score-double-trick{background:linear-gradient(135deg,#A020F0,#6A0DAD)!important;color:#fff!important;font-weight:900;border:2px solid #00d2ff;animation:dt 1s infinite alternate}
@keyframes dt{to{transform:scale(1.1);box-shadow:0 0 18px rgba(0,210,255,.8)}}
.score-jump{border:2px solid #aaa;background:linear-gradient(135deg,#0f2027,#2c5364)!important;color:#00d2ff!important;font-weight:900;text-shadow:0 0 8px rgba(0,210,255,.5)}
.score-dragon{background:linear-gradient(135deg,#FFD700,#FFFACD,#FFD700)!important;color:#000!important;border:2px solid #B8860B;font-weight:900;animation:dg .8s ease-in-out infinite alternate}
@keyframes dg{from{transform:scale(1.05);box-shadow:0 0 10px #FFD700}to{transform:scale(1.2);box-shadow:0 0 25px #FFD700}}
#jackpotOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;opacity:0;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(5px)}
#jackpotOverlay.show{opacity:1}
#jackpotMsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);min-width:280px;max-width:90%;padding:40px 30px;border-radius:35px;font-size:32px;font-weight:900;text-align:center;z-index:9999;border:4px solid #fdfdfd;box-shadow:0 0 100px rgba(0,210,255,.4);pointer-events:none;transition:transform .6s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap}
#jackpotMsg.show{transform:translate(-50%,-50%) scale(1)}
#effSub{display:block;font-size:14px;letter-spacing:4px;opacity:.7;margin-top:10px;font-family:'Courier New',monospace}
#dragonEntity{position:fixed;top:50%;left:50%;font-size:120px;z-index:10000;pointer-events:none;display:none;filter:drop-shadow(0 0 30px gold)}
@keyframes dragonCircle{to{transform:translate(-50%,-50%) rotate(360deg) translateX(120px) rotate(-360deg)}}
.shake-ani{animation:shake .5s both}@keyframes shake{20%,80%{transform:translateX(2px)}30%,70%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.ultra-shake{animation:us .1s infinite}@keyframes us{50%{transform:translate(-3px,-3px)}}
.fab{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);width:68px;height:68px;background:linear-gradient(135deg,var(--primary),#0056b3);color:#fff;border-radius:24px;font-size:30px;border:none;box-shadow:0 10px 25px rgba(0,122,255,.4);z-index:100;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:2000;backdrop-filter:blur(8px)}
.sheet{background:var(--card);width:100%;max-width:500px;max-height:92dvh;overflow-y:auto;margin:0 auto;border-radius:30px 30px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
input{width:100%;padding:14px;border-radius:var(--rm);border:2px solid var(--line);background:var(--soft);color:var(--text);font-size:16px;margin-bottom:10px;outline:none}
.btn-main{width:100%;padding:16px;border-radius:var(--rm);border:none;background:var(--primary);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn-ghost{width:100%;background:none;border:none;color:var(--gray);margin-top:10px;padding:10px;cursor:pointer}
.fire{display:inline-block;animation:burn .5s infinite alternate;color:var(--warning);font-weight:800}@keyframes burn{to{transform:scale(1.2)}}
.page{display:none;animation:pi .3s ease-out}.page.active{display:block}@keyframes pi{from{opacity:0;transform:translateY(10px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--soft);padding:12px;border-radius:12px}.stat small{font-size:11px;color:var(--gray);display:block;margin-bottom:4px}.stat b{font-size:18px}
.lbl{font-size:12px;font-weight:800;color:var(--gray);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer}
.chip.sm{padding:8px 12px;font-size:14px}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.mini{width:100%;border-collapse:collapse}.mini td,.mini th{padding:8px 4px;text-align:center;font-size:14px;border-top:1px solid var(--line)}.mini td:first-child{text-align:left;font-weight:700}.mini th{font-size:11px;color:var(--gray);border:none}
.bak{background:rgba(255,149,0,.15);color:var(--warning);padding:12px 14px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:14px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.btn-soft{padding:12px;border-radius:var(--rm);border:none;background:var(--card);font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.lrow{margin-bottom:10px}.lrow b{display:block;font-size:13px;margin-bottom:6px}

.num{display:flex;align-items:center;gap:4px;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:0 10px}.num:focus-within{border-color:var(--primary)}.num span{font-weight:800;font-size:18px}
.num{cursor:pointer;min-width:84px;min-height:44px;user-select:none}.num b{font-size:18px;min-width:44px}.num b.ph{color:var(--gray);font-weight:600}
.num.act{border-color:var(--primary);background:var(--card)}
.num.act b::after{content:'';display:inline-block;width:2px;height:20px;background:var(--primary);margin-left:2px;vertical-align:middle;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#numpad{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:500px;z-index:2100;grid-template-columns:repeat(4,1fr);grid-auto-rows:48px;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--soft);border-top:1px solid var(--line)}
.key{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:none;border-radius:12px;background:var(--card);font-size:22px;font-weight:600;color:var(--text);box-shadow:0 1px 0 rgba(0,0,0,.2);cursor:pointer}.key:active{background:var(--line)}
.key.fn{font-size:16px}.key.go{grid-row:span 2;background:var(--primary);color:#fff;font-size:17px}
.modal.np .sheet{margin-bottom:calc(236px + env(safe-area-inset-bottom,0px));max-height:calc(100dvh - 236px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px) - 20px);padding-bottom:16px}
.sum{text-align:center;font-size:18px;margin:14px 0;min-height:24px}.hint{color:var(--gray);font-size:13px}
.rk{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,30px);background:#1C1C1E;color:#fff;padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:3000;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
</style>
</head>
<body>
<div id="jackpotOverlay"></div><div id="dragonEntity">🐉</div>
<div id="jackpotMsg"><div id="effTitle"></div><span id="effSub"></span></div>
<div id="numpad"></div>
<div id="toast"></div>
<div class="app">
<div class="safe-top"></div>
<div class="scroll">
  <div id="pLobby" class="page active">
    <p style="font-size:10px;font-weight:800;color:var(--ac);letter-spacing:1.5px;margin-bottom:5px">PREMIUM SCOREBOARD</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px"><h1 style="font-size:28px">🏸 Badminton Pro</h1><button class="btn-glass" id="setBtn" title="Cài đặt">⚙️</button></div>
    <div id="bakBanner"></div><div id="listTables"></div>
    <button id="addTableBtn" class="btn-main">+ Khởi tạo sân mới</button>
    <div class="row2"><button class="btn-soft" id="expBtn">⬇️ Xuất backup</button><button class="btn-soft" id="impBtn">⬆️ Nhập backup</button></div>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn-soft" id="syncBtn" style="width:100%;margin-top:10px">☁️ Bật đồng bộ GitHub Gist</button>
  </div>
  <div id="pGame" class="page">
    <div class="nav">
      <button id="backBtn" class="btn-glass">←</button>
      <button id="privacyBtn" class="pill">🔓 Công khai</button>
      <button id="sumBtn" class="btn-glass" title="Tổng kết">📊</button>
      <button id="cfgBtn" class="btn-glass" title="Cài đặt">⚙️</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 id="tableName" style="font-size:24px"></h2>
      <span id="roundLabel" class="rl"></span>
    </div>
    <p id="todayLine" style="font-size:12px;color:var(--gray);margin:-6px 0 12px"></p><div class="tw"><div class="ts"><table><thead id="hHead"></thead><tbody id="hTotal"></tbody><tbody id="hBody"></tbody></table></div></div>
  </div>
</div>
<button id="addRoundBtn" class="fab" style="display:none">+</button>

<div id="mCreate" class="modal"><div class="sheet">
  <h2 style="margin-bottom:16px">Cài đặt sân đấu</h2>
  <input id="inTableName" placeholder="Tên sân (VD: Sân THVL)">
  <div id="inPlayers"></div>
  <button id="addPField" style="background:none;border:none;color:var(--ac);font-weight:700;margin-bottom:12px;cursor:pointer">+ Thêm thành viên</button>
  <button id="confirmTable" class="btn-main">Bắt đầu trận đấu</button>
  <button class="btn-ghost close-m">Hủy bỏ</button>
</div></div>

<div id="mScore" class="modal"><div class="sheet">
  <h2 id="scoreTitle" style="text-align:center"></h2>
  <div id="scoreInputs"></div>
  <div id="sumBox" class="sum"></div>
  <button id="saveScore" class="btn-main" style="background:var(--success)">Lưu kết quả</button>
  <button id="repeatBtn" class="btn-main" style="background:var(--soft);color:var(--text);margin-top:10px">↻ Lặp ván trước</button>
  <button id="delRound" class="btn-main" style="background:var(--danger);display:none;margin-top:10px">Xóa ván đấu</button>
  <button class="btn-ghost close-m">Đóng</button>
</div></div>

<div id="mSet" class="modal"><div class="sheet">
  <h2 style="margin-bottom:14px">⚙️ Cài đặt</h2>
  <div class="lbl" style="margin-top:0">Giao diện</div>
  <div class="chips" id="themeChips"></div>
  <button class="btn-ghost close-m">Đóng</button>
</div></div>
<div id="mSync" class="modal"><div class="sheet">
  <h2 style="margin-bottom:6px">☁️ Đồng bộ GitHub Gist</h2>
  <p class="hint" style="margin-bottom:12px">Tạo token (classic) chỉ cần quyền <b>gist</b> tại github.com/settings/tokens. Dữ liệu nằm trong một Gist riêng tư của bạn.</p>
  <input id="syToken" type="password" placeholder="GitHub token (ghp_...)" autocomplete="off">
  <input id="syGist" placeholder="Gist ID (để trống để tự tạo mới)" autocomplete="off">
  <p id="syStatus" class="hint" style="margin-bottom:12px"></p>
  <button id="sySave" class="btn-main">Lưu &amp; đồng bộ ngay</button>
  <button id="syOff" class="btn-ghost" style="color:var(--danger)">Ngắt kết nối</button>
  <button class="btn-ghost close-m">Đóng</button>
</div></div>
<div id="mStats" class="modal"><div class="sheet">
  <h2 id="statsTitle" style="text-align:center;margin-bottom:6px"></h2>
  <div id="statsContent"></div>
  <button class="btn-main close-m" style="background:var(--soft);color:var(--text);margin-top:18px">Đóng</button>
</div></div>
</div>

<script>
const KEY='pro_badminton_final',COL=['#007AFF','#FF3B30','#34C759','#FF9500','#A020F0','#5AC8FA'];
const BAK='pro_badminton_bak_',LASTBAK='pro_badminton_lastbak';
const rounds=a=>Array.isArray(a)?a.reduce((n,t)=>n+((t&&t.history)||[]).length,0):-1;
const readKey=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const loadData=()=>{let d=readKey(KEY);
 if(!Array.isArray(d)||!d.length){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k&&k!==KEY&&k!==LASTBAK&&k.startsWith('pro_badminton')){const x=readKey(k);if(rounds(x)>rounds(d))d=x}}}
 return Array.isArray(d)?d:[]};
let appData=loadData();
const norm=()=>appData.forEach(t=>{t.ts=Array.isArray(t.ts)?t.ts:[];while(t.ts.length<t.history.length)t.ts.push(null);t.ts.length=t.history.length});
norm();
try{const raw=localStorage.getItem(KEY);if(raw&&raw!==localStorage.getItem(BAK+'0')){['1','0'].forEach(n=>{const v=localStorage.getItem(BAK+n);if(v)localStorage.setItem(BAK+(+n+1),v)});localStorage.setItem(BAK+'0',raw)}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let curId=null,editIdx=-1,isMasked=false,E={},toastT;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=ns=>{try{localStorage.setItem(KEY,JSON.stringify(appData))}catch(e){toast('⚠️ Không lưu được dữ liệu, hãy xuất backup ngay')}if(!ns)scheduleSync()};
const cur=()=>appData.find(x=>x.id===curId);
const cf=o=>window.confetti&&confetti(o);

/* ---- Luật & hiệu ứng ---- */
const combo=r=>{if(r.length!==4)return null;const w=Math.max(...r),o=[...r];o.splice(r.indexOf(w),1);const c=v=>o.filter(x=>x===v).length;
 if(w===120&&c(-40)===3)return'dragon';if(w===60&&c(-20)===3)return'jump';
 if(w===40&&c(-40)===1&&c(0)===2)return'double';if(w===20&&c(-20)===1&&c(0)===2)return'trick';return null};
const CLS={dragon:'score-dragon',jump:'score-jump',double:'score-double-trick',trick:'score-trick'};
const FX={dragon:['🐉 RỒNG 🐉','UNSTOPPABLE','linear-gradient(135deg,#FFD700,#FFFACD,#FFD700)','#1c1c1e',['#FFD700','#FFA500']],
 jump:['⚡ JUMP SMASH ⚡','💥💥💥','linear-gradient(135deg,#141e30,#243b55)','#00d2ff',['#00d2ff','#C0C0C0','#FFFFFF']],
 double:['✨ DOUBLE TRICK ✨','CINEMATIC','linear-gradient(135deg,#A020F0,#00d2ff)','#fff',['#A020F0','#00d2ff','#FFFFFF']],
 trick:['🏸 TRICK SHOT 🏸','GOTCHA','linear-gradient(135deg,#A020F0,#E0B0FF,#A020F0)','#fff',['#A020F0','#E0B0FF','#FFFFFF']]};

const fx=k=>{const[a,b,bg,c,cols]=FX[k],m=$('jackpotMsg'),d=$('dragonEntity'),ov=$('jackpotOverlay');
 $('effTitle').innerText=a;$('effSub').innerText=b;m.style.background=bg;m.style.color=c;
 document.body.classList.add(k==='dragon'?'ultra-shake':'shake-ani');
 if(k==='dragon'){d.style.display='block';d.style.animation='dragonCircle 2.5s linear infinite'}
 m.classList.add('show');ov.classList.add('show');
 setTimeout(()=>{m.classList.remove('show');ov.classList.remove('show');d.style.display='none';document.body.classList.remove('ultra-shake','shake-ani')},4000);
 const end=Date.now()+4000;(function f(){cf({particleCount:15,angle:60,spread:60,origin:{x:0,y:.6},colors:cols});cf({particleCount:15,angle:120,spread:60,origin:{x:1,y:.6},colors:cols});if(Date.now()<end)requestAnimationFrame(f)})()};

/* ---- UI helpers ---- */
const route=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));$('addRoundBtn').style.display=id==='pGame'?'block':'none'};
const hideModals=()=>{document.querySelectorAll('.modal').forEach(m=>{m.style.display='none';m.classList.remove('np')});$('numpad').style.display='none'};
const toast=(msg)=>{const e=$('toast');e.innerHTML=`<span>${esc(msg)}</span>`;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3000)};
const mutate=(msg,fn)=>{const t=cur();fn(t);t.mod=Date.now();save();renderGame();toast(msg)};

/* ---- Tính toán ---- */
const sums=t=>t.players.map((_,i)=>t.history.reduce((a,r)=>a+r[i],0));
const fmt=v=>(v>0?'+':'')+v;
const isToday=ts=>!!ts&&new Date(ts).toDateString()===new Date().toDateString();
const daily=t=>{const rows=t.history.filter((_,i)=>isToday(t.ts[i]));return{n:rows.length,s:t.players.map((_,i)=>rows.reduce((a,r)=>a+r[i],0))}};
const dailyHtml=t=>{const d=daily(t),tot=sums(t);if(!d.n)return'<div class="lbl">Hôm nay</div><p class="hint">Chưa có ván nào hôm nay</p>';

const updSum=()=>{syncNp();if(E.mode==='m')return $('sumBox').innerHTML=freeSum();const t=cur(),s=losersOf(t).reduce((a,i)=>a+(E.pen[i]||0),0);

const setWin=i=>{E.win=i;E.pen[i]=0;E.buf='';const l=losersOf(cur());E.act=l.length?l[0]:-1;renderEntry()};

const setBao=i=>{const t=cur();E.mode='w';E.win=i;t.players.forEach((_,k)=>{if(k!==i)E.pen[k]=20;else E.pen[i]=0});E.act=-1;renderEntry()};

const setMode=m=>{E.mode=m;E.win=-1;E.pen=E.pen.map(()=>0);E.role=E.pen.map(()=>'n');E.amt=E.pen.map(()=>null);E.act=-1;E.buf='';renderEntry()};
const modeChips=()=>'<div class="chips">'+[['w','🏆 1 người thắng'],['m','👥 Tự do']].map(([k,v])=>`<button class="chip sm ${E.mode===k?'on':''}" onclick="setMode('${k}')">${v}</button>`).join('')+'</div>';

const setRole=(i,k)=>{E.role[i]=E.role[i]===k?'n':k;if(E.role[i]==='n')E.amt[i]=null;E.buf='';E.act=E.role[i]==='n'?-1:i;renderEntry()};
const mScores=t=>{const idx=t.players.map((_,i)=>i),sc=idx.map(i=>E.role[i]==='w'?(E.amt[i]||0):E.role[i]==='l'?-(E.amt[i]||0):0),
 bl=idx.filter(i=>E.role[i]!=='n'&&E.amt[i]==null);
 if(bl.length===1)sc[bl[0]]=-sc.reduce((a,v)=>a+v,0);
 const net=sc.reduce((a,v)=>a+v,0),okSign=idx.every(i=>E.role[i]==='w'?sc[i]>0:E.role[i]==='l'?sc[i]<0:true);
 return{sc,net,ok:E.role.includes('w')&&E.role.includes('l')&&bl.length<=1&&net===0&&okSign}};
const freeSum=()=>{const t=cur(),m=mScores(t),parts=t.players.map((p,i)=>m.sc[i]?`${esc(p)} <b style="color:var(--${m.sc[i]>0?'success':'danger'})">${fmt(m.sc[i])}</b>`:'').filter(Boolean);

const putVal=v=>{if(E.mode==='m')E.amt[E.act]=v;else E.pen[E.act]=v||0};

const loadRow=r=>{const P=r.filter(x=>x>0).length;E.mode=P>1?'m':'w';
 if(E.mode==='m'){E.role=r.map(s=>s>0?'w':s<0?'l':'n');E.amt=r.map(s=>Math.abs(s));E.win=-1;E.pen=r.map(()=>0)}

 if(M&&!M.ok)return toast('Cần ≥1 người thắng, ≥1 người thua và tổng cân bằng = 0');if(!tot)return toast('Cần nhập điểm cho ít nhất 1 người');
 if(!M)sc[E.win]=-tot;const cb=combo(sc),ei=editIdx;

const chart=t=>{const n=t.history.length;if(!n)return'';
 const cum=t.players.map((_,i)=>{let a=0;return[0,...t.history.map(r=>a+=r[i])]}),all=cum.flat(),mn=Math.min(...all),mx=Math.max(...all),W=300,H=150,P=8,rg=(mx-mn)||1;

 +cum.map((c,i)=>`<polyline fill="none" stroke="${COL[i%6]}" stroke-width="2.5" stroke-linejoin="round" points="${c.map((v,k)=>X(k)+','+Y(v)).join(' ')}"/>`).join('')
 +'</svg><div class="legend">'+t.players.map((p,i)=>`<span><i style="background:${COL[i%6]}"></i>${esc(p)}</span>`).join('')+'</div>'};
const medal=i=>['🥇','🥈','🥉'][i]||(i+1)+'.';

 +'<div class="grid2"><button class="btn-main" onclick="shareText()">📋 Gửi văn bản</button><button class="btn-main" onclick="shareImg()">🖼 Gửi ảnh</button></div>';

const shareText=async()=>{const t=cur();let txt=`🏸 ${t.name} — ${t.history.length} ván\n`+rank(t).map((r,i)=>`${medal(i)} ${r.p}: ${r.s>0?'+':''}${r.s}`).join('\n');const d=daily(t);if(d.n){const tot=sums(t);txt+=`\n\n📅 Hôm nay (${d.n} ván):\n`+t.players.map((p,i)=>`${p}: ${fmt(d.s[i])} (tổng ${fmt(tot[i])})`).join('\n')}

const SYK='pro_badminton_sync',TOMB='pro_badminton_tomb',GF='badminton-pro.json';
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let sy=rd(SYK,{}),tomb=rd(TOMB,{}),syncing=false,again=false,syT,syErr='';
const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
const gh=async(url,opt={})=>{const res=await fetch('https://api.github.com'+url,{cache:'no-store',...opt,headers:{Authorization:'Bearer '+sy.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});

  throw new Error(res.status===401?'Token sai hoặc hết hạn (401)':res.status===404?'Không tìm thấy Gist (404)':res.status===403?'GitHub từ chối (403)':'+m')}
 return res.json()};
const mergeData=(a,b,tb)=>{const m={};[...a,...b].forEach(t=>{if(!t||!t.id||!Array.isArray(t.history))return;const o=m[t.id],x=t.mod||0;
  if(!o||x>(o.mod||0)||(x===(o.mod||0)&&t.history.length>o.history.length))m[t.id]=t});
 return Object.values(m).filter(t=>!(tb[t.id]&&tb[t.id]>=(t.mod||0)))};
const syncUI=()=>{const t=sy.at?new Date(sy.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'';
 $('syncBtn').innerText=sy.token?(syErr?'⚠️ Đồng bộ lỗi':'☁️ Đã đồng bộ'+(t?' lúc '+t:'')):'☁️ Bật đồng bộ GitHub Gist';
 $('syStatus').innerText=syErr?'Lỗi: '+syErr:(sy.token?'Đã kết nối'+(t?'. Đồng bộ lần cuối lúc '+t:''):'Chưa kết nối')};
const syncNow=async()=>{if(!sy.token)return;
 if($('mScore').style.display==='flex'){clearTimeout(syT);syT=setTimeout(syncNow,4000);return}
 if(syncing){again=true;return}syncing=true;syErr='';$('syncBtn').innerText='☁️ Đang đồng bộ…';
 try{let remote={data:[],tomb:{}};const id=sy.gist;
  if(id){const g=await gh('/gists/'+id),f=g.files&&g.files[GF];
   if(f){const txt=f.truncated?await(await fetch(f.raw_url,{cache:'no-store'})).text():f.content,j=JSON.parse(txt);remote={data:Array.isArray(j.data)?j.data:[],tomb:j.tomb||{}}}}
  const tb={...remote.tomb};Object.keys(tomb).forEach(k=>tb[k]=Math.max(tb[k]||0,tomb[k]));
  const merged=mergeData(appData,remote.data,tb);
  if(!same(merged,appData)){appData=merged;norm();save(true)}
  tomb=tb;wr(TOMB,tomb);
  if(!id||!same(remote.data,merged)||!same(remote.tomb,tb)){
   const files={[GF]:{content:JSON.stringify({v:1,at:Date.now(),data:merged,tomb:tb})}};
   if(id)await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files})});
   else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Badminton Pro data',public:false,files})});sy.gist=g.id}}
  sy.at=Date.now();wr(SYK,sy)
 }catch(e){syErr=e.message}
 syncing=false;syncUI();
 if($('pGame').classList.contains('active')){cur()?renderGame():route('pLobby')}renderLobby();
 if(again){again=false;syncNow()}};
const scheduleSync=()=>{if(!sy.token)return;clearTimeout(syT);syT=setTimeout(syncNow,2500)};
$('syncBtn').onclick=()=>{$('syToken').value=sy.token||'';$('syGist').value=sy.gist\vert{}\vert{}'';syncUI();$('mSync').style.display='flex'};
$('sySave').onclick=()=>{const tk=$('syToken').value.trim();if(!tk)return toast('Hãy nhập GitHub token');
 sy={token:tk,gist:$('syGist').value.trim().replace(/.*\//,''),at:0};wr(SYK,sy);hideModals();toast('Đang đồng bộ…');syncNow()};
$('syOff').onclick=()=>{if(!confirm('Ngắt đồng bộ? Dữ liệu trên máy vẫn được giữ nguyên.'))return;sy={};wr(SYK,sy);hideModals();syncUI();toast('Đã ngắt đồng bộ')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
window.addEventListener('online',syncNow);
setInterval(()=>{if(!document.hidden)syncNow()},60000);
syncUI();syncNow();
$('expBtn').onclick=exportData;$('impBtn').onclick=()=>$('impFile').click();$('impFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr))throw 0;let n=0;
  arr.forEach(t=>{if(!t||!t.id||!Array.isArray(t.players)||!Array.isArray(t.history))return;const o=appData.find(x=>x.id===t.id);
   if(!o){appData.push(t);n++}else if(t.history.length>o.history.length){Object.assign(o,t);n++}});
  norm();save();renderLobby();toast(`Đã nhập ${n} sân`)}catch(err){toast('File backup không hợp lệ')}};
renderLobby();
</script>
